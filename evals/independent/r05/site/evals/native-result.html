<!doctype html><html lang="ko"><meta charset="utf-8"><title>Native result fixture</title><style>body{margin:0;background:#15191c;color:white}iframe{width:600px;height:320px;border:0}pre{white-space:pre-wrap}</style><iframe id="fixture" src="../index.html?test=1&seed=101"></iframe><pre id="observations"></pre><script>
document.getElementById('fixture').onload=()=>{const f=document.getElementById('fixture'),w=f.contentWindow,a=w.BlackoutTesting,d=f.contentDocument,c=(x,y,p,q)=>a.connect(x,y,p,q),loop=x=>{c('source',x,'plus','left');c(x,'source','right','minus')},pair=(x,y)=>{c(x,y,'left','left');c(y,x,'right','right')};a.start();loop('lamp-1');a.advance(12);pair('lamp-1','lamp-2');a.advance(12);loop('lamp-3');a.advance(12);pair('lamp-3','motor-1');a.advance(15.2);const capture=()=>{const v={humanStatus:'not_run',seed:a.snapshot().seed,mode:a.snapshot().mode,paused:a.snapshot().paused,history:w.BlackoutSession.history(),current:a.events(),pauseLabel:d.getElementById('pause-button').getAttribute('aria-label')};document.getElementById('observations').textContent=JSON.stringify({seed:v.seed,mode:v.mode,paused:v.paused,historySeeds:v.history.map(x=>x.seed),pauseLabel:v.pauseLabel});fetch('/__evidence/native-latest',{method:'POST',body:JSON.stringify(v,null,2)})};d.addEventListener('click',()=>setTimeout(capture,0));capture()};
</script></html>
