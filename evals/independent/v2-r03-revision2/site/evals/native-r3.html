<!doctype html><meta charset="utf-8"><title>Native repair and undo</title><style>body{margin:0;background:#15191c;color:white}iframe{width:600px;height:320px;border:0}pre{white-space:pre-wrap}</style><iframe id="fixture" src="../index.html?test=1"></iframe><pre id="observations"></pre><script>document.getElementById('fixture').onload=()=>{const f=document.getElementById('fixture'),w=f.contentWindow,d=f.contentDocument,a=w.BlackoutTesting,history=[];a.start();a.connect('feeder-A','lamp-1','plus','left');a.connect('lamp-1','feeder-A','right','minus');a.advance(12.1);const capture=event=>{const z=a.snapshot(),v={event,edges:z.edges,lessonSolved:z.lessonSolved,stable:z.analysis.allStable,readings:['lamp-1','lamp-2','lamp-3'].map(id=>({id,voltage:z.analysis.nodes[id].voltage,powered:z.analysis.nodes[id].powered,text:d.getElementById('node-'+id).textContent})),undoHidden:d.getElementById('undo-wire').hidden,events:a.events().events.filter(e=>['wire_removed','wire_undo'].includes(e.event))};history.push(v);document.getElementById('observations').textContent=JSON.stringify({event,edges:v.edges.map(x=>x.id),stable:v.stable,readings:v.readings,undoHidden:v.undoHidden,events:v.events},null,2);fetch('/__evidence/native-history',{method:'POST',body:JSON.stringify({humanStatus:'not_run',history},null,2)})};for(const type of ['click','keydown','pointerup'])d.addEventListener(type,()=>setTimeout(()=>capture(type),0),true);capture('setup')};</script>
