<!doctype html><meta charset="utf-8"><title>Settled repair layout</title><style>body{font:14px system-ui;background:#15191c;color:white}iframe{width:1280px;height:720px}pre{white-space:pre-wrap}</style><pre id="results">running</pre><iframe id="fixture" src="../index.html?test=1"></iframe><script>document.getElementById('fixture').onload=async()=>{const f=document.getElementById('fixture'),w=f.contentWindow,d=f.contentDocument,a=w.BlackoutTesting,cases=[];a.start();a.connect('feeder-A','lamp-1','plus','left');a.connect('lamp-1','feeder-A','right','minus');a.advance(12.1);const rect=e=>{const q=e.getBoundingClientRect();return {text:e.textContent,x:q.x,y:q.y,right:q.right,bottom:q.bottom}},overlap=(x,y)=>Math.min(x.right,y.right)>Math.max(x.x,y.x)&&Math.min(x.bottom,y.bottom)>Math.max(x.y,y.y);for(const [width,height]of[[1280,720],[1920,1080],[760,550],[600,320],[390,844],[761,380]]){f.style.width=width+'px';f.style.height=height+'px';await new Promise(r=>setTimeout(r,1000));const hints=['hint-title','hint-detail'].map(id=>rect(d.getElementById(id))),others=[...d.querySelectorAll('.device-reading,.facility-name,.node-shell,.terminal-ring,.hud,.toolbox,.utility'),d.getElementById('cable-value'),d.getElementById('cable-note')].map(rect),conflicts=[];for(const h of hints)for(const o of others)if(overlap(h,o))conflicts.push({hint:h,other:o});cases.push({width,height,status:conflicts.length?'fail':'pass',hints,conflicts})}const v={humanStatus:'not_run',passed:cases.filter(x=>x.status==='pass').length,total:cases.length,cases};document.getElementById('results').textContent=JSON.stringify(v,null,2);fetch('/__evidence/repair-layout',{method:'POST',body:JSON.stringify(v,null,2)})};</script>
