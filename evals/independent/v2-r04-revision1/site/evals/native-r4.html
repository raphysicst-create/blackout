<!doctype html><meta charset="utf-8"><title>R4 native interaction</title><style>body{margin:0;background:#15191c;color:white;font:14px system-ui}iframe{display:block;width:600px;height:320px;border:0}pre{white-space:pre-wrap}</style><iframe id="fixture" src="../index.html?test=1"></iframe><button id="trip">Evaluator: advance to cooled trip</button><button id="safe">Evaluator: safe reassignment</button><pre id="results">loading</pre><script>
document.getElementById('fixture').onload=()=>{const f=document.getElementById('fixture'),d=f.contentDocument,a=f.contentWindow.BlackoutTesting,history=[];const c=(x,y,p,q)=>a.connect(x,y,p,q),loop=(x,F)=>{c('feeder-'+F,x,'plus','left');c(x,'feeder-'+F,'right','minus')},remove=x=>{for(const e of [...a.snapshot().edges])if(!e.fixed&&(e.a===x||e.b===x))a.remove(e.id)};a.start();loop('lamp-1','A');a.advance(12);a.remove(a.snapshot().edges.find(e=>e.a==='lamp-2'&&e.b==='lamp-3').id);c('lamp-2','feeder-B','right','minus');c('feeder-B','lamp-3','plus','left');a.advance(12);loop('motor-1','A');a.advance(9);const capture=event=>{const state=a.snapshot(),item={event,time:state.time,paused:state.paused,circuits:a.circuits(),riskHidden:d.getElementById('risk-status').hidden,demandHidden:d.getElementById('demand-status').hidden,hintQuiet:d.getElementById('hint').classList.contains('quiet'),wireAction:d.getElementById('wire-actions').textContent,wireActionHidden:d.getElementById('wire-actions').hidden};history.push(item);document.getElementById('results').textContent=JSON.stringify({humanStatus:'not_run',history},null,2);fetch('/__evidence/native-history',{method:'POST',body:JSON.stringify({humanStatus:'not_run',history},null,2)})};document.getElementById('trip').onclick=()=>{a.advance(12.2);capture('evaluator advanced to cooled trip')};document.getElementById('safe').onclick=()=>{remove('motor-1');remove('lamp-2');loop('motor-1','B');loop('lamp-2','A');capture('evaluator safe reassignment')};for(const event of ['pointerup','keyup'])d.addEventListener(event,e=>setTimeout(()=>capture(event+':'+(e.target.id||e.key)),50),true);capture('ready')};</script>
