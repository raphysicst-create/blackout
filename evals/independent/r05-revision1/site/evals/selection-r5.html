<!doctype html><html lang="ko"><meta charset="utf-8"><title>Seed URL selection</title><pre id="results">running</pre><script>
(async()=>{const cases=[];for(const [query,seed] of [['seed=202',202],['seed=303',303],['seed=999',101],['legacy=1&seed=303',101]]){const f=document.createElement('iframe');f.width=600;f.height=380;const done=new Promise(r=>f.onload=r);f.src='../index.html?test=1&'+query;document.body.append(f);await done;const a=f.contentWindow.BlackoutTesting,actual=a.snapshot().seed;const title=f.contentDocument.getElementById('district-name').textContent;a.reset({seed:303});const resetSeed=a.snapshot().seed;cases.push({query,expected:seed,actual,title,resetSeed,status:actual===seed&&resetSeed===(query.includes('legacy')?101:303)?'pass':'fail'});f.remove()}const v={humanStatus:'not_run',passed:cases.filter(x=>x.status==='pass').length,total:cases.length,cases};document.getElementById('results').textContent=JSON.stringify(v,null,2);fetch('/__evidence/seed-url',{method:'POST',body:JSON.stringify(v,null,2)})})();
</script></html>
