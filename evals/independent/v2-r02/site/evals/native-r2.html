<!doctype html><meta charset="utf-8"><title>Native feeder controls</title><style>body{margin:0;background:#15191c;color:white}iframe{width:600px;height:320px;border:0}pre{white-space:pre-wrap}</style><iframe id="fixture" src="../index.html?test=1"></iframe><button id="fresh">Evaluator: fresh run</button><pre id="observations"></pre><script>
document.getElementById('fixture').onload=()=>{const f=document.getElementById('fixture'),w=f.contentWindow,d=f.contentDocument,a=w.BlackoutTesting,b=d.getElementById('board'),history=[],c=(x,y,p,q)=>a.connect(x,y,p,q),loop=(x,F)=>{c('feeder-'+F,x,'plus','left');c(x,'feeder-'+F,'right','minus')};a.start();loop('lamp-1','A');a.advance(12);loop('lamp-2','A');a.advance(12);loop('lamp-3','B');a.advance(12);loop('motor-1','A');a.advance(6.1);for(const e of a.snapshot().edges)if(!e.fixed&&(e.a==='motor-1'||e.b==='motor-1'))a.remove(e.id);loop('motor-1','B');a.advance(3);
const capture=event=>{const s=a.snapshot(),point=p=>{const q=new w.DOMPoint(p.x,p.y).matrixTransform(b.getScreenCTM());return {x:q.x,y:q.y}},v={event,circuits:a.circuits(),mode:s.mode,stable:s.analysis.allStable,wireCount:s.edges.length,nodes:s.nodes.map(n=>({id:n.id,...point(n)})),voltage:s.analysis.nodes['lamp-1'].voltage,firstPowered:s.analysis.nodes['lamp-1'].powered,resetEvents:a.events().events.filter(e=>e.event==='feeder_reset'),terminalIds:[...d.querySelectorAll('[data-port]')].map(x=>x.id),button:{disabled:d.getElementById('delete-wire').disabled,text:d.getElementById('delete-wire').textContent}};history.push(v);document.getElementById('observations').textContent=JSON.stringify(v,null,2);fetch('/__evidence/native-history',{method:'POST',body:JSON.stringify({humanStatus:'not_run',history},null,2)})};for(const type of ['click','keydown','pointerup'])d.addEventListener(type,()=>setTimeout(()=>capture(type),0),true);document.getElementById('fresh').onclick=()=>{a.reset();a.start();capture('fresh')};capture('setup')};
</script>
