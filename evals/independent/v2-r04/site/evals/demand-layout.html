<!doctype html><meta charset="utf-8"><title>R4 demand layout</title><style>body{background:#15191c;color:white;font:14px system-ui}iframe{width:1280px;height:720px;border:0}pre{white-space:pre-wrap}</style><pre id="results">running</pre><iframe id="fixture" src="../index.html?test=1"></iframe><script>
document.getElementById('fixture').onload=async()=>{const f=document.getElementById('fixture'),d=f.contentDocument,a=f.contentWindow.BlackoutTesting,cases=[];
const c=(x,y,p,q)=>a.connect(x,y,p,q),loop=(x,F)=>{c('feeder-'+F,x,'plus','left');c(x,'feeder-'+F,'right','minus')};
a.start();loop('lamp-1','A');a.advance(12);a.remove(a.snapshot().edges.find(e=>e.a==='lamp-2'&&e.b==='lamp-3').id);c('lamp-2','feeder-B','right','minus');c('feeder-B','lamp-3','plus','left');a.advance(12);loop('motor-1','A');a.advance(9);
const rect=q=>({x:q.x,y:q.y,right:q.right,bottom:q.bottom});
for(const stage of ['preview','tripped']){if(stage==='tripped')a.advance(9.1);for(const [width,height]of[[1280,720],[390,844],[600,320]]){f.style.width=width+'px';f.style.height=height+'px';await new Promise(r=>setTimeout(r,1000));const ids=stage==='preview'?['demand-status']:['risk-title','risk-detail','hint-title','hint-detail'];const texts=ids.map(id=>{const e=d.getElementById(id),r=d.createRange();r.selectNodeContents(e);return {id,text:e.textContent,element:rect(e.getBoundingClientRect()),rects:[...r.getClientRects()].map(rect)}});const clipped=texts.flatMap(t=>t.rects.filter(r=>r.x<0||r.right>width||r.y<0||r.bottom>height).map(r=>({id:t.id,text:t.text,rect:r})));const overlap=(x,y)=>Math.min(x.right,y.right)>Math.max(x.x,y.x)&&Math.min(x.bottom,y.bottom)>Math.max(x.y,y.y);const facilities=[...d.querySelectorAll('.device-reading,.facility-name')].map(e=>({text:e.textContent,...rect(e.getBoundingClientRect())}));const panel=d.getElementById(stage==='preview'?'demand-status':'risk-status');const panelRect=rect(panel.getBoundingClientRect());const conflicts=[];for(const other of facilities){if(overlap(panelRect,other))conflicts.push({overlay:panel.id,panel:panelRect,other});for(const t of texts.filter(t=>t.id.startsWith('hint-')))for(const r of t.rects)if(overlap(r,other))conflicts.push({overlay:t.id,text:t.text,rect:r,other})}cases.push({stage,width,height,status:clipped.length||conflicts.length?'fail':'pass',texts,clipped,conflicts})}}
const v={humanStatus:'not_run',passed:cases.filter(x=>x.status==='pass').length,total:cases.length,cases};document.getElementById('results').textContent=JSON.stringify(v,null,2);fetch('/__evidence/demand-layout',{method:'POST',body:JSON.stringify(v,null,2)})};</script>
