<!doctype html><html><meta charset="utf-8"><title>R4 cooling UI fixture</title><style>body{background:#233039;color:white;font:16px system-ui}iframe{width:600px;height:380px;border:1px solid white}</style><h1>R4 cooling: all three loads powered, residual heat</h1><iframe id="fixture" src="../index.html?test=1"></iframe><script>
document.getElementById('fixture').addEventListener('load',()=>{const a=document.getElementById('fixture').contentWindow.BlackoutTesting;const c=(...x)=>a.connect(...x),loop=id=>{c('source',id,'plus','left');c(id,'source','right','minus')},pair=(x,y)=>{c(x,y,'left','left');c(y,x,'right','right')};a.reset();a.start();loop('lamp-1');a.advance(12);pair('lamp-1','lamp-2');a.advance(12);pair('lamp-1','lamp-3');a.advance(2);for(const e of a.snapshot().edges)if((e.a==='lamp-1'&&e.b==='lamp-3')||(e.a==='lamp-3'&&e.b==='lamp-1'))a.remove(e.id);loop('lamp-3');a.advance(.05)});
</script></html>
