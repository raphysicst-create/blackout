<!doctype html><meta charset="utf-8"><pre id="results">running</pre><iframe id="fixture" width="600" height="320" src="../index.html?test=1&legacy=1"></iframe><script>document.getElementById('fixture').onload=()=>{const f=document.getElementById('fixture'),a=f.contentWindow.BlackoutTesting,b=f.contentDocument.getElementById('board'),states=[{step:'load',viewBox:b.getAttribute('viewBox')}];a.start();states.push({step:'start',viewBox:b.getAttribute('viewBox')});a.reset();states.push({step:'reset',viewBox:b.getAttribute('viewBox')});const v={humanStatus:'not_run',passed:states.filter(x=>x.viewBox==='0 0 1200 760').length,total:states.length,states};document.getElementById('results').textContent=JSON.stringify(v);fetch('/__evidence/legacy-frame',{method:'POST',body:JSON.stringify(v,null,2)})};</script>
