<!doctype html><html lang="ko"><meta charset="utf-8"><title>R3 native input observations</title><style>body{margin:0;background:#101518;color:white;font:14px system-ui}iframe{width:100vw;height:600px;border:0}pre{white-space:pre-wrap;margin:8px}</style><iframe id="fixture" src="../index.html?test=1"></iframe><pre id="observations">loading</pre><script>
document.getElementById('fixture').addEventListener('load',()=>{const f=document.getElementById('fixture'),w=f.contentWindow,d=f.contentDocument,a=w.BlackoutTesting;const previews=[];a.reset();a.start();const show=()=>{document.getElementById('observations').textContent=JSON.stringify({humanStatus:'not_run',cable:a.cable(),edges:a.snapshot().edges.length,loadPowered:a.snapshot().analysis.nodes['lamp-1'].powered,previewTexts:previews,toast:d.getElementById('toast').textContent})};new w.MutationObserver(()=>{const text=d.getElementById('cable-note').textContent;if(text.includes('필요')&&!previews.includes(text))previews.push(text);show()}).observe(d.getElementById('cable-note'),{childList:true,subtree:true,characterData:true});d.getElementById('board').addEventListener('pointerup',()=>setTimeout(show,0));show()});
</script></html>
