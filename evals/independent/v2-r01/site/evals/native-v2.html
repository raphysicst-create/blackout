<!doctype html><html lang="ko"><meta charset="utf-8"><title>Native V2-R1 fixture</title><style>body{margin:0;background:#15191c;color:white}iframe{width:600px;height:320px;border:0}pre{white-space:pre-wrap}</style><iframe id="fixture" src="../index.html?test=1"></iframe><pre id="observations"></pre><script>
document.getElementById('fixture').onload=()=>{const f=document.getElementById('fixture'),w=f.contentWindow,d=f.contentDocument,a=w.BlackoutTesting,b=d.getElementById('board'),history=[],c=(x,y,p,q)=>a.connect(x,y,p,q),loop=x=>{c('source',x,'plus','left');c(x,'source','right','minus')},pair=(x,y)=>{c(x,y,'left','left');c(y,x,'right','right')};a.start();loop('lamp-1');a.advance(12);pair('lamp-1','lamp-2');a.advance(12);loop('lamp-3');a.advance(12);pair('lamp-3','motor-1');
const capture=event=>{const s=a.snapshot(),point=p=>{const q=new w.DOMPoint(p.x,p.y).matrixTransform(b.getScreenCTM());return{x:q.x,y:q.y}},v={event,viewBox:b.getAttribute('viewBox'),edges:s.edges.map(e=>({id:e.id,a:e.a,b:e.b,point:point(a.geometry(e.id).at(.25))})),focus:[...d.querySelectorAll('.circuit-focus')].map(x=>x.id),selected:[...d.querySelectorAll('.wire.selected')].map(x=>x.id),terminals:s.nodes.filter(n=>n.type!=='junction').flatMap(n=>(n.type==='source'?['plus','minus']:['left','right']).map(p=>({id:`terminal-${n.id}-${p}`,...point(a.terminalPoint(n.id,p))}))),nodes:s.nodes.map(n=>({id:n.id,...point(n)})),actions:{hidden:d.getElementById('wire-actions').hidden,text:d.getElementById('wire-actions').textContent},events:a.events().events.filter(e=>e.event==='wire_remove'||e.event==='circuit_selected')};history.push(v);document.getElementById('observations').textContent=JSON.stringify(v,null,2);fetch('/__evidence/native-history',{method:'POST',body:JSON.stringify({humanStatus:'not_run',history},null,2)})};for(const event of ['click','keydown','pointerdown','pointerup'])d.addEventListener(event,()=>setTimeout(()=>capture(event),0));capture('initial')};
</script></html>
