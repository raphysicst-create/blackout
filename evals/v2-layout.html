<!doctype html><html><meta charset="utf-8"><title>V2 layout regression</title><pre id="results">running</pre><script>
const sizes=[[1280,720],[1920,1080],[760,550],[600,320],[390,844],[761,380]], reports=[];
for(const [width,height] of sizes){const f=document.createElement('iframe');f.style.cssText=`width:${width}px;height:${height}px;border:0`;f.src='../index.html?test=1';document.body.append(f);f.onload=()=>{const a=f.contentWindow.BlackoutTesting;a.start();a.connect('feeder-A','lamp-1','plus','left');a.connect('lamp-1','feeder-A','right','minus');a.advance(12.5);setTimeout(()=>{const d=f.contentDocument,h=d.getElementById('hint').getBoundingClientRect(),hits=[];for(const e of d.querySelectorAll('.device-reading,.terminal,.facility-name')){const r=e.getBoundingClientRect();if(h.left<r.right&&h.right>r.left&&h.top<r.bottom&&h.bottom>r.top)hits.push(e.id||e.parentElement.id+':'+e.classList.value);}for(const span of d.querySelectorAll("#hint span")){const range=d.createRange();range.selectNodeContents(span);for(const r of range.getClientRects())if(r.left<0||r.right>width)hits.push("text-clipped:"+span.id);}reports.push({width,height,hits,hint:h.toJSON(),style:d.getElementById("hint").getAttribute("style"),matrix:{a:d.getElementById("board").getScreenCTM().a,e:d.getElementById("board").getScreenCTM().e,f:d.getElementById("board").getScreenCTM().f}});document.getElementById('results').textContent=JSON.stringify(reports,null,2);},1200);};}
</script></html>
